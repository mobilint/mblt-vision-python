DEFAULT:
  # pre_cfg is upstream YOLOX's own test transform (yolox/data/data_augment.py
  # preproc via ValTransform(legacy=False)): a cv2 BGR image resized to
  # int(w * r) x int(h * r) -- truncated, hence size_rounding: floor -- onto a
  # 114-filled canvas anchored top-left, and left unscaled, hence no Normalize.
  # Boxes are restored by dividing by r. post_cfg follows mblt-model-ops'
  # YOLOX-Nano/pipeline.yaml (branch jm/temp, 0368367e8).
  # No Hub artifact is published yet: pass a local model_path.
  file_cfg:
    repo_id: mobilint/YOLOX-Nano
    filename: yolox_nano.mxq
    revision: main
    local_artifact_only: true
  pre_cfg:
    Reader:
      style: numpy
      color_mode: BGR
    LetterBox:
      img_size:
      - 416
      - 416
      center: false
      padding_value: 114
      size_rounding: floor
    SetOrder:
      shape: HWC
  post_cfg:
    task: object_detection
    dataset: coco
    head: yolox
    nl: 3
    strides:
    - 8
    - 16
    - 32
    conf_thres: 0.001
    iou_thres: 0.65
