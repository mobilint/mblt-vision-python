DEFAULT:
  # The Hub artifact this Model will ship as; a local run overrides it with
  # `model_path=<file>.onnx`. pre_cfg and post_cfg mirror
  # ../mblt-model-ops/models/YOLOX-Tiny/pipeline.yaml, which is the source of truth.
  file_cfg:
    repo_id: mobilint/YOLOX-Tiny
    filename: yolox_tiny.mxq
    revision: main
  pre_cfg:
    Reader:
      style: numpy
      color_mode: BGR
    LetterBox:
      img_size:
      - 416
      - 416
      center: false
      padding_value: 114
    SetOrder:
      shape: HWC
  post_cfg:
    task: object_detection
    dataset: coco
    yolox: true
    nl: 3
    conf_thres: 0.001
    iou_thres: 0.65
