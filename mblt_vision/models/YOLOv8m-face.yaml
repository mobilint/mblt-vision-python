DEFAULT:
  file_cfg:
    repo_id: mobilint/YOLOv8m-face
    filename: yolov8m-face.mxq
    revision: main
  pre_cfg:
    Reader:
      style: numpy
    LetterBox:
      # yolov8m-face.pt's own embedded train_args records imgsz: 960, unlike
      # every other face-detection size/family, which train at 640.
      img_size:
      - 960
      - 960
    SetOrder:
      shape: HWC
    Normalize:
      style: cv
  post_cfg:
    task: face_detection
    dataset: widerface
    nl: 3
    reg_max: 16
    conf_thres: 0.001
    iou_thres: 0.7
TURBO:
  update: DEFAULT
  file_cfg:
    revision: TURBO
