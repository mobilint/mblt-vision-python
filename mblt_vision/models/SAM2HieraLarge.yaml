DEFAULT: HIERA_LARGE
HIERA_LARGE:
  file_cfg:
    # Documentation only -- SAM2HieraLarge resolves both artifacts itself
    # (mblt_vision/mask_generation/sam2.py) because it needs two independent
    # MXQ files (encoder + decoder), not the single-artifact file_cfg this
    # section otherwise encodes for every other model.
    repo_id: mobilint/sam2-hiera-large
    encoder_filename: sam2_hiera_large_encoder.mxq
    decoder_filename: sam2_hiera_large_decoder.mxq
    # ONNX artifacts derive the package-wide same-stem convention
    # (sam2_hiera_large_{encoder,decoder}.onnx) and live at the Hub repo
    # root (board-agnostic), unlike the board-folder MXQ artifacts above.
    target_device: aries-rb
  pre_cfg: {}
  post_cfg:
    task: mask_generation
    dataset: sa-v
