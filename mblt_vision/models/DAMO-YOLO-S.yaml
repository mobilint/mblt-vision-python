DEFAULT:
  # The Hub artifact this Model will ship as; a local run overrides it with
  # `model_path=<file>.onnx`. pre_cfg and post_cfg mirror
  # ../mblt-model-ops/models/DAMO-YOLO-S/pipeline.yaml, which is the source of truth.
  file_cfg:
    repo_id: mobilint/DAMO-YOLO-S
    filename: damoyolo_s.mxq
    revision: main
  pre_cfg:
    Reader:
      style: numpy
      color_mode: RGB
    LetterBox:
      # The December 2022 release's geometry: aspect-preserving, zero-padded, anchored
      # top-left. Upstream's HEAD stretches instead, but that describes the March 2023
      # weights, which are no longer downloadable. Measured on COCO val2017: stretch
      # 39.72 mAP, this 41.79, against upstream's published 41.8.
      img_size:
      - 640
      - 640
      keep_ratio: true
      center: false
      padding_value: 0
    SetOrder:
      shape: HWC
  post_cfg:
    task: object_detection
    dataset: coco
    damoyolo: true
    nl: 3
    reg_max: 16
    conf_thres: 0.05
    iou_thres: 0.7
