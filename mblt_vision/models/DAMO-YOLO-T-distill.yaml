DEFAULT:
  # pre_cfg is the test transform of upstream DAMO-YOLO's December 2022 release
  # (tinyvision/DAMO-YOLO 55ae14f), the only checkpoints still downloadable: a
  # PIL RGB decode, cv2 resized to int(w * r) x int(h * r) -- truncated, hence
  # size_rounding: floor -- zero-padded into the top-left corner, and left
  # unscaled, hence no Normalize. BoxList.resize restores each axis by its own
  # original-over-resized ratio, hence per_axis_ratio. (41.79 mAP50-95 on COCO
  # val2017, against 39.72 through upstream HEAD's stretch.) post_cfg follows
  # mblt-model-ops' DAMO-YOLO-T-distill/pipeline.yaml (branch jm/temp, 0368367e8);
  # reg_max 16 means 17 distance bins.
  # No Hub artifact is published yet: pass a local model_path.
  file_cfg:
    repo_id: mobilint/DAMO-YOLO-T-distill
    filename: damoyolo_t_distill.mxq
    revision: main
    local_artifact_only: true
  pre_cfg:
    Reader:
      style: pil
    LetterBox:
      img_size:
      - 640
      - 640
      center: false
      padding_value: 0
      size_rounding: floor
      per_axis_ratio: true
    SetOrder:
      shape: HWC
  post_cfg:
    task: object_detection
    dataset: coco
    head: damoyolo
    nl: 3
    reg_max: 16
    conf_thres: 0.05
    iou_thres: 0.7
