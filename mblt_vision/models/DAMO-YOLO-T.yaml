DEFAULT:
  # pre_cfg/post_cfg follow mblt-model-ops' DAMO-YOLO-T/pipeline.yaml (branch jm/temp, 0368367e8):
  # the downloadable checkpoints are the December 2022 release, whose test
  # transform letterboxes RGB with zeros anchored top-left (41.79 mAP50-95 on
  # COCO val2017, against 39.72 through upstream HEAD's stretch) and feeds the
  # unscaled image -- hence no Normalize. reg_max 16 means 17 distance bins.
  # No Hub artifact is published yet: pass a local model_path.
  file_cfg:
    repo_id: mobilint/DAMO-YOLO-T
    filename: damoyolo_t.mxq
    revision: main
    local_artifact_only: true
  pre_cfg:
    Reader:
      style: numpy
      color_mode: RGB
    LetterBox:
      img_size:
      - 640
      - 640
      center: false
      padding_value: 0
    SetOrder:
      shape: HWC
  post_cfg:
    task: object_detection
    dataset: coco
    head: damoyolo
    nl: 3
    reg_max: 16
    conf_thres: 0.05
    iou_thres: 0.7
