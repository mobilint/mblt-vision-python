DEFAULT:
  # The Hub artifact this Model will ship as; a local run overrides it with
  # `model_path=<file>.onnx`. pre_cfg and post_cfg mirror
  # ../mblt-model-ops/models/YuNet/pipeline.yaml, which is the source of truth.
  file_cfg:
    repo_id: mobilint/YuNet
    filename: yunet.mxq
    revision: main
  pre_cfg:
    Reader:
      style: numpy
      color_mode: BGR
    LetterBox:
      # Upstream's eval transform: aspect-preserving resize, then Pad(pad_value=0) into
      # the top-left corner, and no scaling of the pixels at all.
      img_size:
      - 640
      - 640
      keep_ratio: true
      center: false
      padding_value: 0
    SetOrder:
      shape: HWC
  post_cfg:
    task: face_detection
    dataset: widerface
    yunet: true
    nl: 3
    conf_thres: 0.02
    iou_thres: 0.45
