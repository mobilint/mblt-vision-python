# DOTAv1 validation dataset. Paths are relative to `path` unless absolute.
name: dotav1
path: ~/.mblt_model_zoo/datasets/dotav1
tasks:
  - obb
val: images
labels: labels/val_original
# Dataset-owned evaluation methodology, selected by model post_cfg.eval_protocol.
eval_protocol:
  id: dota-native-multirate-1024-500.v1
  tiling:
    crop_size: 1024
    gap: 500
    rates: [0.5, 1.0, 1.5]
    im_rate_thr: 0.6
    eps: 0.01
    jpeg_roundtrip: true
  inference:
    preprocessing: ultralytics-val
    conf_thres: 0.01
    iou_thres: 0.7
    max_det: 300
  merge:
    method: rotated_probiou_fastnms
    iou_thres: 0.3
    classwise: true
names:
  0: plane
  1: ship
  2: storage-tank
  3: baseball-diamond
  4: tennis-court
  5: basketball-court
  6: ground-track-field
  7: harbor
  8: bridge
  9: large-vehicle
  10: small-vehicle
  11: helicopter
  12: roundabout
  13: soccer-ball-field
  14: swimming-pool
download:
  type: google_drive_folder
  url: https://drive.google.com/drive/folders/1n5w45suVOyaqY84hltJhIZdtVFD9B224
  images_archive: images/part1.zip
  labels_archive: labelTxt-v1.0/labelTxt.zip
