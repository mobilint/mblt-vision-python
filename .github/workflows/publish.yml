name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Verify wheel package contents
        run: |
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel, = Path('dist').glob('*.whl'); archive = ZipFile(wheel); assert 'mblt_vision/py.typed' in archive.namelist(), 'Wheel is missing mblt_vision/py.typed'"

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Diagnose PyPI and TestPyPI OIDC endpoints
        shell: bash
        timeout-minutes: 6
        continue-on-error: true
        run: |
          diagnostic_dir="$(mktemp -d)"
          trap 'rm -rf "$diagnostic_dir"' EXIT

          for attempt in {1..5}; do
            for host in pypi.org test.pypi.org; do
              echo "::group::OIDC diagnosis: ${host}, attempt ${attempt}/5"
              date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'

              # Clear previous responses so a connection failure cannot show stale data.
              : > "$diagnostic_dir/headers"
              : > "$diagnostic_dir/body"

              curl_exit=0
              curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 20 \
                --dump-header "$diagnostic_dir/headers" \
                --output "$diagnostic_dir/body" \
                --write-out 'HTTP=%{http_code} IP=%{remote_ip} TIME=%{time_total}s\n' \
                "https://${host}/_/oidc/audience" || curl_exit=$?

              echo "CURL_EXIT=${curl_exit}"
              echo "--- response headers ---"
              cat "$diagnostic_dir/headers"
              echo "--- response body (first 4096 bytes) ---"
              head -c 4096 "$diagnostic_dir/body"
              echo
              echo "::endgroup::"
            done

            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verify-metadata: true

  publish-to-pypi:
    name: Publish to PyPI 🚀
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verify-metadata: true
